		<script id='default_field_source'>
function default_field_body() {
 return "// Missing default-field coefficients use their startup defaults.\nvar defaults=[3.5,3,1.5,3,-1,2];\nvar coefficients=[];\nfor(var k=0;k<6;k++) coefficients[k]=k<c.length ? c[k] : defaults[k];\nc=coefficients;\nfor (var i=0,j=0; i<size3; i++,j+=n) {\n var t = Math.sqrt(Math.abs(x[j]*x[j] + x[j+1]*x[j+1] - c[0])) - c[1];\n var u = Math.sqrt(Math.abs(x[j+2]*x[j+2] + (n > 3 ? x[j+3]*x[j+3] : 0) - c[2])) - c[3];\n values[i] = t*t + u*u - (n > 4 ? c[4]*Math.sin(c[5]*x[j+4]) : 0);\n}";
}
		</script>

		<script type='text/worker' id='worker'>

		  var setup = function(dim, s, octant) {
		  	this.n = dim;

        var axis_min = -10;
        var axis_max =  10;
        var axis_range = axis_max - axis_min;

		  	this.size = s;
		  	this.size2 = size*size;
		  	this.size3 = size*size*size;

				if (typeof this.points == 'undefined') {
		  		this.points = new Float32Array(3*size3);
				}
				if (points.length < 3*size3) {
					this.points = new Float32Array(3*size3);
				}

				if (typeof this.values == 'undefined') {
					this.values = new Float32Array(size3);
				}
				if (values.length < size3) {
					this.values = new Float32Array(size3);
				}

				if (typeof this.coords == 'undefined') {
		  		this.coords = new Float32Array(n*size3);
		  	}
		  	if (coords.length < n*size3) {
					this.coords = new Float32Array(n*size3);
		  	}

				if (typeof this.cube_index_table == 'undefined') {
					this.cube_index_table = new Int16Array(size3);
				}
				if (cube_index_table.length < size3) {
					this.cube_index_table = new Int16Array(size3);
				}

        var x_offset = ((octant & 1) > 0) ? axis_min : 0;
        var y_offset = ((octant & 2) > 0) ? axis_min : 0;
        var z_offset = ((octant & 4) > 0) ? axis_min : 0;

		  	var index = 0;
        var spacing = 0.5 * axis_range / (size - 1);
		  	for (var k = 0; k < size; k++) {
          var z = z_offset + spacing * k;
		  		for (var j = 0; j < size; j++) {
            var y = y_offset + spacing * j;
		  			for (var i = 0; i < size; i++, index+=3) {
							points[index  ] = x_offset + spacing * i; // Could do strength reduction on this.
							points[index+1] = y;
							points[index+2] = z;
		  			}
		  		}
		  	}
		  }

		  function update_coords_function(n, s) {
		  	a = '';
        a = a + 'var c_index = 0;\n';
        a = a + 'var p_index = 0;\n';
        a = a + 'var translation = [';
		  	for (var i=0; i<n; i++) {
          a = a + 'r['+i+']['+n+'],'
		  	}
		  	a = a + '];\n';

		  	a = a + 'var c1 = [';
		  	for (var i=0; i<n; i++) {
          a = a + 'r['+i+'][0],';
		  	}
		  	a = a + '];\n';

        a = a + 'var z_translation = [';
		  	for (var i=0; i<n; i++) {
		  		a = a + '0,'
		  	}
		  	a = a + '];\n';

        a = a + 'var yz_translation = [';
		  	for (var i=0; i<n; i++) {
		  		a = a + '0,'
		  	}
		  	a = a + '];\n';

		  	a = a + 'for (var k=0; k<'+s+'; k++) {\n';
		  	for (var i=0; i<n; i++) {
          a = a + 'z_translation['+i+'] = r['+i+'][2]*points[p_index+2] + translation['+i+'];\n'
		  	}

		  	a = a + 'for (var j=0; j<'+s+'; j++) {\n';
		  	for (var i=0; i<n; i++) {
          a = a + 'yz_translation['+i+'] = r['+i+'][1]*points[p_index+1] + z_translation['+i+'];\n'
		  	}

        a = a + 'for (var i=0; i<'+s+'; i++, c_index+='+n+', p_index+=3) {\n';
		  	for (var i=0; i<n; i++) {
          // a = a + 'coords[c_index]['+i+'] = c1['+i+']*points[p_index  ] + yz_translation['+i+'];\n'
					a = a + 'coords[c_index+'+i+'] = c1['+i+']*points[p_index  ] + yz_translation['+i+'];\n'
		  	}

		  	a = a + '} } }';
		  	return a;
		  }

		  function default_field() {
            return new Function('x', 'c', default_field_body());
		  }

		  function update_field_function(data) {
        if (typeof data.code == 'string') field = new Function('x', 'c', data.code);

		  }

		  function rebuild_scalar_field(c, num) {
		  	if (typeof field == 'undefined') {
          this.field = default_field();
		  	}
				field(coords, c);
		  	/*try {
		  		if (isNaN( field([0,0,0,0,0], c) )) {
		  			throw 'NaN Error.';
		  		}
		  	} catch (err) {
		  		if (num == 0) {
		  			console.log(err);
            console.log('Code compiled, but returned NaN when evaluated at the origin.\nIs coeff_count too low? Are you accessing c[] out of bounds?');
		  		}
		  	}*/

				/*
		  	// Most JS compilers don't optimize functions with try catch blocks, so we bypass that issue by making a new function.
        var apply_field = function() {
		  		for (var i = 0; i < size3; i++) {
		  			values[i] = field(coords[i], c);
		  		}
		  	};
        apply_field();
				*/
		  }

		  function is_number(n) {
		    return !isNaN(parseFloat(n)) && isFinite(n);
		  }

		  function rebuild_coords_indirectly(r) {
        rebuild_coords(r); // This makes it show up nicer in the profiler.
		  }

		  onmessage = function(e) {
	    	console.time('Worker ' + e.data.num + ' Task');
            var previous_field = typeof field == 'undefined' ? null : field;
            // Establish ownership even if user code throws before geometry work.
            this.vertex_buffer = e.data.vertex_buffer;
            this.face_buffer = e.data.face_buffer;
            this.normal_buffer = e.data.normal_buffer;
            try {
        switch (e.data.message_type) {
	    		case 'echo':
	    			self.postMessage( e.data.num );
	    		break;
	    		case  'init':
	    			setup(e.data.params.dimensions, e.data.params.resolution, e.data.num);
            this.rebuild_coords = new Function('r', update_coords_function(e.data.n, e.data.params.resolution));
	    		case 'coords':
            rebuild_coords_indirectly(e.data.r); // rebuild_coords() is an anonymous function and makes profiling weird.
	    		case 'code':
            update_field_function(e.data);
          case 'scalar_field':
            rebuild_scalar_field(e.data.params.coeff, e.data.num);
	    		case 'geometry':
                        if (this.field_needs_recovery) rebuild_scalar_field(e.data.params.coeff, e.data.num);
                        this.field_needs_recovery = false;
						this.vertex_buffer = e.data.vertex_buffer;
						this.face_buffer = e.data.face_buffer;
						this.normal_buffer = e.data.normal_buffer;
						marching_cubes( points, values, e.data.params.iso, e.data.params.interpolate, e.data.calc_normals, e.data.num, e.data.params.memory_overuse );
            reply(e.data.num, e.data.batch_id);
	    		break;
	    		default:
	    			console.log('ERROR');
	    		break;
	    	}
            } catch (err) {
                this.field = previous_field || default_field();
                this.field_needs_recovery = true;
                var returned = [vertex_buffer, face_buffer, normal_buffer];
                self.postMessage({num:e.data.num, batch_id:e.data.batch_id, error:String(err.message || err), buffers:returned}, returned);
            }
		  	//console.timeEnd('Worker ' + e.data.num + ' Task');
		  }

		  function reply(num, batch_id) {
				var b = [vertex_buffer, face_buffer, normal_buffer];
//				if (num==0) console.log(vertex_buffer.byteLength);
        self.postMessage( {num: num, batch_id:batch_id, buffers: b, vertex_count: active_vertex_count, index_count: active_index_count}, b);
//console.log(typeof buffers[0]);
//self.postMessage( buffers, buffers );
		  }
		</script>

		<script type='text/worker' id='marching_cubes'>
		  /**
		   * @author alteredq / http://alteredqualia.com/
		   *
		   * Port of greggman's ThreeD version of marching cubes to Three.js
		   * http://webglsamples.googlecode.com/hg/blob/blob.html
		   */

		   /*	Marching cube implementation from:
          Three.js "tutorials by example"
		   		Author: Lee Stemkoski
          http://stemkoski.github.io/Three.js/
          Date: July 2013 (Three.js v59dev)
		  		Some modifications have been made.
		   */

			function hamming_weight(i) {
			  i = i - ((i >> 1) & 0x55555555);
			  i = (i & 0x33333333) + ((i >> 2) & 0x33333333);
			  return (((i + (i >> 4)) & 0x0F0F0F0F) * 0x01010101) >> 24;
			}

		  function marching_cubes( points, values, iso, interpolate, calc_normals, num, memory_overuse) {
				// First pass calculates the necessary sizes of the buffers
				// and caches the "bits" variable.
				var total_vertex_count = 0;
				var total_face_count = 0;
				var idx = 0;
		  	for (var z = 0; z < size - 1; z++) {
				  for (var y = 0; y < size - 1; y++) {
						var prev_cube_index = 0;
				  	for (var x = 0; x < size - 1; x++, idx++) {
							var cube_index = 0;
							if (x==0) {
								var p    = x + size * y + size2 * z;
								var px   = p   + 1;
								var py   = p   + size;
								var pxy  = py  + 1;
								var pz   = p   + size2;
								var pxz  = px  + size2;
								var pyz  = py  + size2;
								var pxyz = pxy + size2;
								var value0 = values[ p    ],
					  			value1 = values[ px   ],
					  			value2 = values[ py   ],
					  			value3 = values[ pxy  ],
					  			value4 = values[ pz   ],
					  			value5 = values[ pxz  ],
					  			value6 = values[ pyz  ],
					  			value7 = values[ pxyz ];
                if ( iso < value0 ) cube_index |= 1;
                if ( iso < value1 ) cube_index |= 2;
                if ( iso < value2 ) cube_index |= 8;
                if ( iso < value3 ) cube_index |= 4;
                if ( iso < value4 ) cube_index |= 16;
                if ( iso < value5 ) cube_index |= 32;
                if ( iso < value6 ) cube_index |= 128;
                if ( iso < value7 ) cube_index |= 64;
								prev_cube_index = cube_index;
								cube_index_table[idx] = cube_index;
								var bits = this.edge_table[ cube_index ];
								//bits_table[bit_index] = bits;
					  		if ( bits === 0 ) continue;
								// 2440 = 8+128+256+2048
								total_vertex_count += hamming_weight( bits & 2440 );
							}
							else {
								' ############################################################################### ';
								px++;
								pxy++;
								pxz++;
								pxyz++;
								value1 = values[ px   ];
								value3 = values[ pxy  ];
								value5 = values[ pxz  ];
								value7 = values[ pxyz ];
								cube_index |= (prev_cube_index & 34) >> 1; // shh bby
								cube_index |= (prev_cube_index & 68) << 1; // is ok
								if ( iso < value1 ) cube_index |=  2;
								if ( iso < value3 ) cube_index |=  4;
								if ( iso < value5 ) cube_index |= 32;
								if ( iso < value7 ) cube_index |= 64;
								prev_cube_index = cube_index; // For next iteration
								cube_index_table[idx] = cube_index;
								var bits = this.edge_table[ cube_index ];
			  				if (bits ===  0) continue;
							}
							// 1655 = 1+2+4+16+32+64+512+1024
							total_vertex_count += hamming_weight(bits & 1655);
							total_face_count += this.face_count[cube_index];
						}
					}
				}
//				if (num==0) console.log(coords);
				memory_overuse += 1;
				if (vertex_buffer.byteLength < total_vertex_count * 3 * 4) {
					this.vertex_buffer = new ArrayBuffer(4 * Math.floor(total_vertex_count * 3 * memory_overuse));
				}
				var vertex_array = new Float32Array(vertex_buffer);

				if (face_buffer.byteLength < total_face_count * 3 * 4) {
					this.face_buffer = new ArrayBuffer(4 * Math.floor(total_face_count * 3 * memory_overuse));
					var face_array = new Uint32Array(face_buffer);
				} else {
					face_array = new Uint32Array(face_buffer);
					for (var i=total_face_count; i<face_array.length; i++) {
						face_array[i] = 0;
					}
				}

				if (normal_buffer.byteLength < total_vertex_count * 3 * 4) {
					this.normal_buffer = new ArrayBuffer(4 * Math.floor(total_vertex_count * 3 * memory_overuse));
				}
				var normal_array = new Float32Array(normal_buffer);

				// var color_buffer = new Float32Array(total_vertex_count * 3);

' %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% ';
' %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% ';
' %%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%%% ';

				var vertex_index = new Array(12);
				var vertex_count = 0;
				for (var i=0;i<12;i++) vertex_index[i] = vertex_count;
//				var buff_geom = new THREE.BufferGeometry();

				var idx = 0;
				var face_offset = 0;
		  	for (var z = 0; z < size - 1; z++) {
				  for (var y = 0; y < size - 1; y++) {
						var prev_cube_index = 0;
				  	for (var x = 0; x < size - 1; x++, idx++) {
							var mu = 0.5;
							var cube_index = 0;
							if (x==0) {
								var p    = x + size * y + size2 * z;
								var px   = p   + 1;
								var py   = p   + size;
								var pxy  = py  + 1;
								var pz   = p   + size2;
								var pxz  = px  + size2;
								var pyz  = py  + size2;
								var pxyz = pxy + size2;
								var value0 = values[ p    ],
					  			value1 = values[ px   ],
					  			value2 = values[ py   ],
					  			value3 = values[ pxy  ],
					  			value4 = values[ pz   ],
					  			value5 = values[ pxz  ],
					  			value6 = values[ pyz  ],
					  			value7 = values[ pxyz ];
								cube_index = cube_index_table[idx];
								prev_cube_index = cube_index;
								var bits = this.edge_table[ cube_index ];
					  		if ( bits === 0 ) continue;
								if ( bits & 8 )	{ // 3 -- p py
					  			mu = ( iso - value0 ) / ( value2 - value0 );
									var offset = 3*vertex_count;
									vertex_array[offset  ] = points[3*p  ] + (points[3*py  ] - points[3*p  ])*mu;
									vertex_array[offset+1] = points[3*p+1] + (points[3*py+1] - points[3*p+1])*mu;
									vertex_array[offset+2] = points[3*p+2] + (points[3*py+2] - points[3*p+2])*mu;
									vertex_index[3] = vertex_count++;
					  		}
								if ( bits & 128 ) { // 7 -- pz pyz
									mu = ( iso - value4 ) / ( value6 - value4 );
									var offset = 3*vertex_count;
									vertex_array[offset  ] = points[3*pz  ] + (points[3*pyz  ] - points[3*pz  ])*mu;
									vertex_array[offset+1] = points[3*pz+1] + (points[3*pyz+1] - points[3*pz+1])*mu;
									vertex_array[offset+2] = points[3*pz+2] + (points[3*pyz+2] - points[3*pz+2])*mu;
									vertex_index[7] = vertex_count++;
								}
								if ( bits & 256 ) { // 8 -- p pz
					  			mu = ( iso - value0 ) / ( value4 - value0 );
									var offset = 3*vertex_count;
									vertex_array[offset  ] = points[3*p  ] + (points[3*pz  ] - points[3*p  ])*mu;
									vertex_array[offset+1] = points[3*p+1] + (points[3*pz+1] - points[3*p+1])*mu;
									vertex_array[offset+2] = points[3*p+2] + (points[3*pz+2] - points[3*p+2])*mu;
									vertex_index[8] = vertex_count++;
					  		}
								if ( bits & 2048 ) { // 11 -- py pyz
					  			mu = ( iso - value2 ) / ( value6 - value2 );
									var offset = 3*vertex_count;
									vertex_array[offset  ] = points[3*py  ] + (points[3*pyz  ] - points[3*py  ])*mu;
									vertex_array[offset+1] = points[3*py+1] + (points[3*pyz+1] - points[3*py+1])*mu;
									vertex_array[offset+2] = points[3*py+2] + (points[3*pyz+2] - points[3*py+2])*mu;
									vertex_index[11] = vertex_count++;
					  		}
							}
							else {
								' ############################################################################### ';
								p = px;
								py = pxy;
								pz = pxz;
								pyz = pxyz;
								px++;
								pxy++;
								pxz++;
								pxyz++;
								value0 = value1;
								value2 = value3;
								value4 = value5;
								value6 = value7;
								value1 = values[ px   ];
								value3 = values[ pxy  ];
								value5 = values[ pxz  ];
								value7 = values[ pxyz ];
								cube_index = cube_index_table[idx];
								prev_cube_index = cube_index;
								var bits = this.edge_table[ cube_index ];
			  				if (bits ===  0) continue;
								if (bits &    8) {
									vertex_index[3] = vertex_index[1];
								}
								if (bits &  128) {
									vertex_index[7] = vertex_index[5];
								}
								if (bits &  256) {
									vertex_index[8] = vertex_index[9];
								}
								if (bits & 2048) {
									vertex_index[11] = vertex_index[10];
								}
							}
' #######################################################################################'

							// Done with special cases
							if ( bits & 1 )	{
								mu = ( iso - value0 ) / ( value1 - value0 );
								var offset = 3*vertex_count;
								vertex_array[offset  ] = points[3*p  ] + (points[3*px  ] - points[3*p  ])*mu;
								vertex_array[offset+1] = points[3*p+1] + (points[3*px+1] - points[3*p+1])*mu;
								vertex_array[offset+2] = points[3*p+2] + (points[3*px+2] - points[3*p+2])*mu;
								vertex_index[0] = vertex_count++;
							}
							// bottom of the cube (z up)
							if ( bits & 2 )	{
								mu = ( iso - value1 ) / ( value3 - value1 );
								var offset = 3*vertex_count;
								vertex_array[offset  ] = points[3*px  ] + (points[3*pxy  ] - points[3*px  ])*mu;
								vertex_array[offset+1] = points[3*px+1] + (points[3*pxy+1] - points[3*px+1])*mu;
								vertex_array[offset+2] = points[3*px+2] + (points[3*pxy+2] - points[3*px+2])*mu;
								vertex_index[1] = vertex_count++;
							}
							if ( bits & 4 )	{
								mu = ( iso - value2 ) / ( value3 - value2 );
								var offset = 3*vertex_count;
								vertex_array[offset  ] = points[3*py  ] + (points[3*pxy  ] - points[3*py  ])*mu;
								vertex_array[offset+1] = points[3*py+1] + (points[3*pxy+1] - points[3*py+1])*mu;
								vertex_array[offset+2] = points[3*py+2] + (points[3*pxy+2] - points[3*py+2])*mu;
								vertex_index[2] = vertex_count++;
							}
							// top of the cube (z up)
							if ( bits & 16 ) {
								mu = ( iso - value4 ) / ( value5 - value4 );
								var offset = 3*vertex_count;
								vertex_array[offset  ] = points[3*pz  ] + (points[3*pxz  ] - points[3*pz  ])*mu;
								vertex_array[offset+1] = points[3*pz+1] + (points[3*pxz+1] - points[3*pz+1])*mu;
								vertex_array[offset+2] = points[3*pz+2] + (points[3*pxz+2] - points[3*pz+2])*mu;
								vertex_index[4] = vertex_count++;
							}
							if ( bits & 32 ) {
								mu = ( iso - value5 ) / ( value7 - value5 );
								var offset = 3*vertex_count;

								var offset = 3*vertex_count;
								vertex_array[offset  ] = points[3*pyz  ] + (points[3*pxyz  ] - points[3*pyz  ])*mu;
								vertex_array[offset+1] = points[3*pyz+1] + (points[3*pxyz+1] - points[3*pyz+1])*mu;
								vertex_array[offset+2] = points[3*pyz+2] + (points[3*pxyz+2] - points[3*pyz+2])*mu;
