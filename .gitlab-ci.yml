# Same checks as local development; only the bootstrap needs a container image.
image:
  name: ghcr.io/astral-sh/uv:0.11.3-python3.12-trixie-slim@sha256:38290b8c4e339e20e881269df1b9a56470846d8ee226dc0b12fe3e31a2c8190d
  entrypoint: [""]

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

checks:
  stage: test
  interruptible: true
  timeout: 10m
  script:
    - uv run --no-project just/ci.py
